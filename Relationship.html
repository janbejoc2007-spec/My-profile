<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relationship Status</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,.1);
    border-radius:50%;
    top:-200px;
    right:-100px;
}

body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    bottom:-150px;
    left:-100px;
}

.card{
    width:90%;
    max-width:700px;
    text-align:center;
    padding:60px 40px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
    color:white;
    z-index:1;
}

.heart{
    font-size:80px;
    animation:heartbeat 1.5s infinite;
}

h1{
    margin-top:15px;
    font-size:3rem;
    font-weight:700;
}

.status{
    margin-top:20px;
    font-size:2rem;
    font-weight:600;
    color:#FFD700;
}

.message{
    margin-top:20px;
    font-size:1.1rem;
    line-height:1.8;
    color:rgba(255,255,255,0.9);
}

.footer{
    margin-top:30px;
    font-size:14px;
    opacity:0.8;
}

@keyframes heartbeat{
    0%{transform:scale(1);}
    25%{transform:scale(1.1);}
    50%{transform:scale(1);}
    75%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

@media(max-width:768px){
    h1{
        font-size:2rem;
    }

    .status{
        font-size:1.5rem;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>Relationship Status</h1>

    <div class="status">
        Complicated
    </div>

    <div class="message">
        Kaka entertain palang ih,ayaw pag dali 💕
    </div>

    <div class="footer">
        Huwat lang lagi mo ako na sunod ❤️
    </div>

</div>

</body>
</html>
